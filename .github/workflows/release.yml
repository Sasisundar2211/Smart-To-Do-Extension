name: release
on:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm ci || npm install
      - name: Build
        run: npm run build
      - name: Zip dist
        run: cd dist && zip -r ../smart-todo.zip .
      - name: Create GitHub Release and Upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: smart-todo.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}